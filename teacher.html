<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교사용 실습일지 현황</title><style>
body{font-family:Arial,"Noto Sans KR",sans-serif;margin:0;background:#f7f7f8;color:#242424}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:white;border:1px solid #ddd;border-radius:16px;padding:18px;margin-bottom:14px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#fafafa;border:1px solid #e6e6e6;border-radius:12px;padding:14px}.big{font-size:24px;font-weight:800}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}th{background:#fafafa}.warn{font-weight:800;color:#b42318}.grade{font-weight:900;color:#c41e3a}.muted{color:#777;font-size:12px}button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.tablewrap{overflow:auto}}</style></head><body><div class="wrap">
<div class="card top"><div><h1 style="margin:0 0 6px">교사용 학급 제출 현황</h1><div class="muted">학생 이름을 저장하지 않는 익명 현황입니다. 유사도는 교사 확인용 참고 지표입니다.</div></div><button onclick="load()">새로고침</button></div>
<div class="card"><b>학급</b> <span id="cls"></span></div><div class="stats" id="stats"></div>
<div class="card tablewrap"><table><thead><tr><th>제출</th><th>품목</th><th>실습일</th><th>충실도</th><th>독창성</th><th>최고 유사도</th><th>등급</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<script>
const params=new URLSearchParams(location.search); const cls=params.get('class')||'default'; document.getElementById('cls').textContent=cls;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){const r=await fetch('/api/class-summary?class_id='+encodeURIComponent(cls));const d=await r.json();if(!r.ok){alert(d.error||'조회 실패');return}const c=d.counts;document.getElementById('stats').innerHTML=`<div class=stat><div class=big>${c.total}</div>총 제출</div><div class=stat><div class=big>${c.A}</div>A 후보/등급</div><div class=stat><div class=big>${c.review}</div>유사도 확인 필요</div><div class=stat><div class=big>${c.D+c.E+c.F}</div>보완 필요</div>`;document.getElementById('rows').innerHTML=d.rows.map((x,i)=>`<tr><td>${d.rows.length-i}</td><td>${esc(x.product)}</td><td>${esc(x.practice_date)}</td><td>${x.completeness??'-'}%</td><td>${x.originality??'-'}%</td><td class="${(x.similarity||0)>=70?'warn':''}">${x.similarity??0}%</td><td class=grade>${esc(x.grade)}</td></tr>`).join('')||'<tr><td colspan=7>아직 제출이 없습니다.</td></tr>'}
load();
</script></body></html>
